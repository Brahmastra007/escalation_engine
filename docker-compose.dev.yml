services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: escalation
      POSTGRES_PASSWORD: escalation
      POSTGRES_DB: escalation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalation"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: "postgresql://escalation:escalation@postgres:5432/escalation"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - ./corporate-ca.pem:/usr/local/share/ca-certificates/corporate-ca.crt
      - api_vscode_extensions:/root/.vscode-server/extensions
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_vscode_extensions:/root/.vscode-server/extensions
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  api_vscode_extensions:
  frontend_vscode_extensions: